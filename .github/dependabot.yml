version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: "/rust/nd30core"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: "/deploy"
    schedule:
      interval: monthly
    ignore:
      # giữ Python 3.11 / Debian bookworm (đã kiểm với LibreOffice, Tesseract); chỉ nhận bản vá
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "rust"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
