# Thêm vào khối server { ... } của tên miền của bạn
# Tab Chuyển đổi Âm thanh: tệp ghi âm lớn hơn các tab khác (đặt TRƯỚC khối location /nd30/)
location ^~ /nd30/api/audio/ {
    proxy_pass http://127.0.0.1:8030/api/audio/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 95m;    # lớn hơn AUDIO_MAX_MB (mặc định 90)
    client_body_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 120s;
}
location = /nd30 { return 301 /nd30/; }
location /nd30/ {
    proxy_pass http://127.0.0.1:8030/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 50m;
    proxy_read_timeout 300s;     # dựng bản in bằng LibreOffice có thể mất vài giây
}
